services:
  postgres:
    image: postgres:15
    container_name: marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vendor-marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: khan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    networks:
      - backend

  vendor-marketplace:
    build: .
    container_name: vendor-marketplace
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Spring Profile
      ACTIVE_PROFILE: dev
      
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/vendor-marketplace
      DB_USER: postgres
      DB_PASSWORD: khan
      
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: admin
      RABBITMQ_PASSWORD: password
      
      # Redis
      REDIS_URL: redis
      REDIS_PORT: 6379
      
      # API Keys
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STRIPE_API_SECRET_KEY: ${STRIPE_API_SECRET_KEY}
      
      # Payment Gateways
      JAZZCASH_MERCHANT_ID: ${JAZZCASH_MERCHANT_ID}
      JAZZCASH_PASSWORD: ${JAZZCASH_PASSWORD}
      JAZZCASH_INTEGRITY_SALT: ${JAZZCASH_INTEGRITY_SALT}
      
      # Email Configuration
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_HOST_PROVIDER: smtp.gmail.com
      EMAIL_PORT: 587
      
      # JWT Secret
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-6pQm/8nXkz1uD0mU5wXrZ4qV9rG7dJk8aLfP9nQw1yZ2xThB9cN4qR5vY7uK3mP0}
      
      # URLs
      BASE_URL: http://localhost:8081
      FRONTEND_URL: http://localhost:5173
      
      # Admin Info
      ADMIN_NAME: ${ADMIN_NAME:-Bilal Khan}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-anonymousalwaysalone@gmail.com}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-03001233445}
    depends_on:
      - postgres
      - rabbitmq
      - redis
    networks:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  backend:
    driver: bridge